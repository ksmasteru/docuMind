spring.application.name=backend
#spring.mongodb.uri=mongodb://root:secret_password@localhost:27017/documind_db?authSource=admin
#spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# 256-bit secret key (Example base64 string)
app.jwt.secret=${JWT_SECRET}
# Expiration: 1 day in milliseconds (86,400,000 ms)
app.jwt.expiration=86400000

app.security.admin-key=${ADMIN_KEY}
# technician accounts are created by their manager; true reopens the public sign-up page
app.auth.self-registration=${ALLOW_SELF_REGISTRATION:false}
# Extra CORS origin, e.g. a Vercel deployment URL — optional, blank if unset
app.cors.frontend-url=${FRONT_END_URL:}

# Report verification: the QR code on each PDF points to <base-url>/verify/<code>.
# Blank = the frontend URL above, else http://localhost:5173. A printed QR code keeps this
# URL forever, so in production set it to an address that lasts.
app.verify.base-url=${VERIFY_BASE_URL:}
# checks per minute and address on the public /api/public/verify endpoint
app.verify.max-per-minute=30

spring.datasource.url=jdbc:postgresql://postgres:5432/documind

spring.datasource.username=documind

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.data.redis.host=${REDIS_HOST:redis}

spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.max-active=16

spring.data.redis.lettuce.pool.max-idle=8

spring.data.redis.lettuce.pool.min-idle=2

management.endpoints.web.exposure.include=health,metrics,prometheus

management.endpoint.prometheus.access=UNRESTRICTED

management.prometheus.metrics.export.enabled=true

analysis.service.url=${ANALYSIS_HOST:http://analysis-service:8001}

# which platform this is (config/Edition.java): full (documind, the default) or rapports, the report
# platform PHOVA uses while the rest is built (plan_rapports_platform.md). Set with APP_EDITION in .env
app.edition=${APP_EDITION:full}

# notifications by e-mail (NotificationMailer): off until SPRING_MAIL_HOST is set in .env, with
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD and MAIL_FROM (SERVER_SETUP.md)
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# an SMTP server that is down must not make /actuator/health (init-server.sh waits on it) say DOWN
management.health.mail.enabled=false
