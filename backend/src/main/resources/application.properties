spring.application.name=backend
#spring.mongodb.uri=mongodb://root:secret_password@localhost:27017/documind_db?authSource=admin
#spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# 256-bit secret key (Example base64 string)
app.jwt.secret=${JWT_SECRET}
# Expiration: 1 day in milliseconds (86,400,000 ms)
app.jwt.expiration=86400000

app.security.admin-key=${ADMIN_KEY}
# Extra CORS origin, e.g. a Vercel deployment URL — optional, blank if unset
app.cors.frontend-url=${FRONT_END_URL:}

# Report verification: the QR code on each PDF points to <base-url>/verify/<code>.
# Blank = the frontend URL above, else http://localhost:5173. A printed QR code keeps this
# URL forever, so in production set it to an address that lasts.
app.verify.base-url=${VERIFY_BASE_URL:}
# checks per minute and address on the public /api/public/verify endpoint
app.verify.max-per-minute=30

spring.datasource.url=jdbc:postgresql://postgres:5432/documind

spring.datasource.username=documind

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.data.redis.host=${REDIS_HOST:redis}

spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.max-active=16

spring.data.redis.lettuce.pool.max-idle=8

spring.data.redis.lettuce.pool.min-idle=2

management.endpoints.web.exposure.include=health,metrics,prometheus

management.endpoint.prometheus.access=UNRESTRICTED

management.prometheus.metrics.export.enabled=true

analysis.service.url=${ANALYSIS_HOST:http://analysis-service:8001}
